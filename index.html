<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto-École Abdellah Belarbi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#1d2229;--steel:#5d6671;--sl:#eef0f3;--sd:#8f98a3;--ok:#2e8b57;
--metal:linear-gradient(135deg,#f4f5f7 0%,#c4c9d0 45%,#e9ebee 60%,#a9b0b9 100%);--font:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--steel);background:#fff;line-height:1.6;overflow-x:hidden;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
html[dir=rtl] body{font-family:'Cairo',var(--font)}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
#splash{position:fixed;inset:0;z-index:300;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#splash.hide{opacity:0;visibility:hidden}
#splash .hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);padding:.6rem 1.4rem;border-radius:999px;background:rgba(29,34,41,.4);color:rgba(255,255,255,.85);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-align:center;text-transform:uppercase}
.logo-big{width:min(62vw,260px);text-align:center;animation:pop 1.2s cubic-bezier(.2,.8,.2,1) both}
.logo-big b{display:block;color:var(--ink);font-weight:800;font-size:1.5rem;letter-spacing:.05em;line-height:1.1;margin-top:.4rem}
.logo-big small{display:block;color:var(--sd);font-weight:700;letter-spacing:.3em;font-size:.75rem;margin-top:.3rem}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
.topbar{background:var(--ink);color:#e6e8ec;font-size:.78rem;padding:calc(env(safe-area-inset-top,0px) + .55rem) 1rem .55rem;display:flex;justify-content:center;align-items:center;gap:1rem;flex-wrap:wrap}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #e3e6ea}
.brand{display:flex;align-items:center;gap:.5rem}
.brand svg{width:46px;height:46px}
.brand b{display:block;color:var(--ink);font-weight:800;font-size:.95rem;letter-spacing:.03em;line-height:1.1}
.brand small{color:var(--sd);font-weight:700;font-size:.6rem;letter-spacing:.16em}
.lang{display:flex;background:var(--sl);border-radius:10px;padding:3px;gap:2px}
.lang button{border:0;background:none;padding:.35rem .8rem;border-radius:8px;font-weight:700;font-size:.75rem;color:#8a929d;cursor:pointer}
.lang button.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(29,34,41,.14)}
.hero{padding:3rem 1.4rem 1.5rem;background:linear-gradient(180deg,#dfe2e7 0%,#f3f4f6 55%,#fff 100%)}
.eyebrow{display:flex;align-items:center;gap:.8rem;color:var(--sd);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:1.1rem}
.eyebrow::before{content:"";width:48px;height:2px;background:var(--sd)}
h1{font-size:clamp(2.1rem,9.5vw,3.2rem);line-height:1.08;color:var(--ink);font-weight:800;text-transform:uppercase}
h1 .metal{background:linear-gradient(135deg,#6b737e,#aab1ba 50%,#59616c);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:1.4rem 0 1.8rem;font-size:1.12rem;max-width:30ch}
.btns{display:flex;flex-direction:column;align-items:flex-start;gap:1rem}
.btn{display:inline-block;padding:1rem 1.6rem;border-radius:12px;font-weight:800;font-size:.85rem;text-transform:uppercase;border:0;cursor:pointer;transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--metal);color:var(--ink);border:1px solid #a9b0b9;box-shadow:0 10px 24px rgba(29,34,41,.2)}
.btn.outline{border:2.5px solid var(--ink);color:var(--ink);background:#fff}
.road{margin:2rem -1.4rem 0;overflow:hidden;height:110px;position:relative}
.road svg{position:absolute;bottom:0;left:0;width:100%;height:110px}
.car{animation:drive 7s linear infinite}
@keyframes drive{from{transform:translateX(-140px)}to{transform:translateX(480px)}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
.promo{padding:2rem 1.4rem 2.5rem}
.card{width:84%;max-width:340px;margin:0 auto 2.2rem;border-radius:22px;padding:2rem 1.5rem;text-align:center;background:var(--metal);color:var(--ink);box-shadow:0 22px 40px rgba(29,34,41,.25);animation:float 5s ease-in-out infinite;position:relative;isolation:isolate}
.card::before{content:"";position:absolute;inset:-8px 8px 8px -8px;z-index:-1;border-radius:22px;background:var(--ink);opacity:.85}
.card .big{font-size:3.4rem;font-weight:800;line-height:1}
.card .tag{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;margin:.4rem 0 1rem}
.card ul{list-style:none;text-align:start;font-weight:700;font-size:.95rem}
.card li{padding:.4rem 0;border-top:1px solid rgba(29,34,41,.2)}
@keyframes float{50%{transform:translateY(-8px)}}
h2{color:var(--ink);font-size:1.5rem;font-weight:800;text-transform:uppercase;margin-bottom:.6rem}
.promo p{font-size:1.1rem}
.formations{padding:1rem 1.4rem 3rem;background:linear-gradient(180deg,#fff,#dfe2e7)}
.grid{display:grid;gap:1rem;margin-top:1.2rem}
.item{background:#fff;border:1px solid #d5d9df;border-radius:16px;padding:1.2rem;box-shadow:0 8px 20px rgba(29,34,41,.07)}
.item i{display:inline-flex;width:42px;height:42px;border-radius:12px;background:var(--metal);align-items:center;justify-content:center;font-style:normal;font-weight:800;color:var(--ink);margin-bottom:.5rem}
.item h3{color:var(--ink);font-size:1.05rem}
.item p{font-size:.95rem}
.videos{padding:2.5rem 1.4rem}
.stage{position:relative;max-width:900px;margin:1.5rem auto 0;--w:min(58vw,270px);height:calc(var(--w)*1.78 + 50px);perspective:1300px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage::after{content:"";position:absolute;left:50%;bottom:6px;width:70%;height:34px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(29,34,41,.35),transparent 70%);filter:blur(6px);z-index:0}
.v3d{position:absolute;top:0;left:50%;width:var(--w);margin-left:calc(var(--w)/-2);aspect-ratio:9/16;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s,filter .9s;cursor:pointer;z-index:1}
.v3d.pos-0{transform:translateZ(60px);z-index:3}
.v3d.pos-l{transform:translateX(-68%) translateZ(-220px) rotateY(42deg) scale(.86);z-index:2}
.v3d.pos-r{transform:translateX(68%) translateZ(-220px) rotateY(-42deg) scale(.86);z-index:2}
.v3d.pos-h{transform:translateZ(-420px) scale(.7);opacity:0;pointer-events:none;z-index:0}
.sway{width:100%;height:100%;transform-style:preserve-3d}
.pos-0 .sway{animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-7deg) rotateX(2deg)}50%{transform:rotateY(7deg) rotateX(-2deg)}}
.face{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;border:9px solid #1d2229;background:#000;box-shadow:0 0 0 2px #c4c9d0,0 34px 55px rgba(29,34,41,.4),inset 0 0 0 1px rgba(255,255,255,.15);transition:transform .15s;will-change:transform}
.face video{width:100%;height:100%;object-fit:cover;display:block}
.shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--px,30%) var(--py,20%),rgba(255,255,255,.38),transparent 55%)}
.badge{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;padding:.4rem .9rem;border-radius:99px;background:var(--metal);color:var(--ink);font-weight:800;font-size:.72rem;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.vnav{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:1.2rem}
.vnav button{width:42px;height:42px;border-radius:50%;border:1px solid #8f98a3;background:var(--metal);color:var(--ink);font-size:1.3rem;font-weight:800;cursor:pointer}
.dots{display:flex;gap:.5rem}.dots i{width:10px;height:10px;border-radius:50%;background:#c4c9d0;transition:.3s}.dots i.on{background:var(--ink);width:26px;border-radius:99px}
footer{background:var(--ink);color:#c9ced5;padding:2.5rem 1.4rem 2rem;text-align:center;font-size:.95rem}
footer b{display:block;color:#fff;font-size:1.1rem;margin-bottom:.8rem;letter-spacing:.04em}
footer a{display:block;margin:.3rem 0;color:#fff;font-weight:700}
/* barre + boutons flottants */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid #d5d9df}
.bar button{width:100%;padding:1rem;border-radius:14px;border:1px solid #8f98a3;background:var(--metal);color:var(--ink);font-weight:800;font-size:.95rem;box-shadow:0 8px 20px rgba(29,34,41,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem}
.fab{position:fixed;z-index:80;width:48px;height:48px;border-radius:50%;border:1px solid #8f98a3;background:#fff;box-shadow:0 8px 18px rgba(29,34,41,.25);display:flex;align-items:center;justify-content:center;bottom:calc(92px + env(safe-area-inset-bottom,0px));cursor:pointer}
#mus{left:14px}
#wa{right:14px;background:#25d366;border-color:#1da851}
html[dir=rtl] #mus{left:auto;right:14px}html[dir=rtl] #wa{right:auto;left:14px}
.fab svg{width:24px;height:24px}
/* dossier */
.ov{position:fixed;inset:0;z-index:200;background:rgba(29,34,41,.55);opacity:0;visibility:hidden;transition:.3s}
.ov.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:210;max-height:92vh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:1.2rem 1.2rem calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.sh h2{margin:0;font-size:1.25rem}
.x{border:0;background:var(--sl);width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer}
.sheet>p{font-size:.92rem;margin-bottom:.8rem}
.prog{height:10px;background:var(--sl);border-radius:99px;overflow:hidden;margin:.4rem 0 .2rem}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8f98a3,var(--ok));transition:width .4s}
.plbl{font-size:.8rem;font-weight:700;color:var(--ink);margin-bottom:.8rem}
.name{width:100%;padding:.85rem 1rem;border:1.5px solid #cfd4db;border-radius:12px;font:inherit;font-size:1rem;margin-bottom:.9rem}
.doc{border:1.5px solid #d5d9df;border-radius:14px;padding:.8rem;margin-bottom:.7rem}
.doc.done{border-color:var(--ok);background:#f3faf6}
.dh{display:flex;align-items:center;gap:.6rem}
.dh .n{width:26px;height:26px;border-radius:8px;background:var(--metal);color:var(--ink);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex:none}
.dh b{color:var(--ink);font-size:.95rem;flex:1}
.dh em{font-style:normal;color:var(--ok);font-weight:800;font-size:.85rem}
.acts{display:flex;gap:.5rem;margin-top:.6rem}
.mini{flex:1;text-align:center;padding:.6rem .4rem;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:.82rem;cursor:pointer}
.mini.alt{background:var(--sl);color:var(--ink)}
.th{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.t{position:relative;width:62px;height:62px;border-radius:10px;overflow:hidden;background:var(--sl);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;color:var(--ink)}
.t img{width:100%;height:100%;object-fit:cover}
.t button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(29,34,41,.75);color:#fff;font-size:.75rem;cursor:pointer}
.note{font-size:.8rem;margin:.5rem 0 1rem}
.send{width:100%;padding:1rem;border:0;border-radius:14px;background:#25d366;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.send:disabled{opacity:.5}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
html[dir=rtl] .btns{align-items:flex-end}
html[dir=rtl] .t button{right:auto;left:2px}
@media(min-width:820px){
.hero{padding:5rem max(2rem,12vw) 2rem}.btns{flex-direction:row}.road{margin:2rem 0 0}
.promo{padding:2rem max(2rem,12vw);display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
.card{margin:0 auto}.formations{padding:2rem max(2rem,12vw) 4rem}.grid{grid-template-columns:repeat(4,1fr)}
.videos{padding:2rem max(2rem,12vw)}}
/* affiches 3D */
.posters{padding:2.5rem 1.4rem}
.pgrid{display:grid;gap:2.4rem;margin-top:1.4rem;justify-items:center}
.pw{perspective:1000px;width:min(78vw,320px);touch-action:pan-y}
.pwi{animation:sway2 8s ease-in-out infinite;transform-style:preserve-3d}
.pw:nth-child(2) .pwi{animation-delay:-2.5s}.pw:nth-child(3) .pwi{animation-delay:-5s}
@keyframes sway2{0%,100%{transform:rotateY(-6deg)}50%{transform:rotateY(6deg)}}
.poster{position:relative;aspect-ratio:3/4;border-radius:22px;padding:1.3rem 1.2rem;display:flex;flex-direction:column;transform-style:preserve-3d;transition:transform .15s;background:var(--metal);color:var(--ink);box-shadow:0 28px 46px rgba(29,34,41,.3),0 0 0 1px #aeb4bc;will-change:transform}
.poster::before{content:"";position:absolute;inset:6px -6px -6px 6px;border-radius:22px;background:#59616c;transform:translateZ(-16px);z-index:-1}
.poster.dark{background:linear-gradient(160deg,#2b323c,#12161b);color:#e9ebee;box-shadow:0 28px 46px rgba(29,34,41,.4),0 0 0 1px #59616c}
.poster.dark::before{background:#c4c9d0}
.poster .shine{border-radius:22px}
.pl{transform:translateZ(calc(var(--z)*1px))}
.poster svg{width:54px;height:46px}
.ptag{font-size:.62rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.75;margin-top:.4rem}
.pt{font-size:1.9rem;line-height:1.05;font-weight:800;text-transform:uppercase;margin:.9rem 0 .3rem;color:inherit}
.ps{font-size:.88rem;font-weight:600;opacity:.8}
.poster ul{list-style:none;margin-top:auto;font-weight:800;font-size:1rem}
.poster li{padding:.55rem .9rem;margin-top:.5rem;border-radius:12px;background:rgba(29,34,41,.1);display:flex;gap:.6rem;align-items:center}
.poster.dark li{background:rgba(255,255,255,.1)}
.poster li::before{content:"✓";font-weight:800}
.pf{margin-top:.9rem;padding:.6rem;border-radius:12px;background:var(--ink);color:#fff;text-align:center;font-weight:800;font-size:.78rem}
.poster.dark .pf{background:var(--metal);color:var(--ink)}
/* carte */
.map{padding:2.5rem 1.4rem}
.mapbox{position:relative;margin-top:1rem;border-radius:20px;overflow:hidden;box-shadow:0 14px 30px rgba(29,34,41,.2);border:1px solid #d5d9df;aspect-ratio:4/3;max-height:480px;background:#e4e7ec}
.mapfb{position:absolute;inset:0;display:block}
.mapfb svg{width:100%;height:100%;display:block}
.maplab{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:92%;text-align:center;padding:.45rem .9rem;border-radius:99px;background:var(--ink);color:#fff;font-weight:800;font-size:.78rem}
.pulse{animation:pls 2s ease-out infinite;transform-box:view-box;transform-origin:200px 150px}
@keyframes pls{from{transform:scale(.3);opacity:.6}to{transform:scale(2.8);opacity:0}}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:grayscale(.55) contrast(1.05);display:none;background:#e4e7ec}
.mapbox.live iframe{display:block}
.maprow{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1rem}
/* commentaires */
.comments{padding:2.5rem 1.4rem 3rem;background:linear-gradient(180deg,#fff,#eef0f3)}
.cform{display:grid;gap:.7rem;margin-top:1rem;max-width:640px}
.cform input,.cform textarea{width:100%;padding:.85rem 1rem;border:1.5px solid #cfd4db;border-radius:12px;font:inherit;font-size:1rem;background:#fff;color:var(--ink)}
.cform textarea{min-height:110px;resize:vertical}
.stars{display:flex;gap:.2rem}
.stars button{border:0;background:none;font-size:1.9rem;line-height:1;color:#c4c9d0;cursor:pointer}
.stars button.on{color:#e0a800}
.clist{display:grid;gap:.8rem;margin-top:1.4rem;max-width:640px}
.cm{background:#fff;border:1px solid #d5d9df;border-radius:14px;padding:1rem;box-shadow:0 6px 16px rgba(29,34,41,.06)}
.cm b{color:var(--ink)}.cm .st{color:#e0a800;letter-spacing:.1em}.cm small{display:block;color:var(--sd)}
.cok{display:none;font-weight:700;color:var(--ok)}.cok.show{display:block}
.cok a{display:block;color:var(--ink);text-decoration:underline;margin-top:.3rem}
.clocal{font-size:.8rem;margin-top:.8rem}
@media(min-width:820px){.posters{padding:2rem max(2rem,12vw)}.pgrid{grid-template-columns:repeat(2,1fr);max-width:760px;margin-left:auto;margin-right:auto}.pw{width:100%;max-width:300px}.map,.comments{padding-left:max(2rem,12vw);padding-right:max(2rem,12vw)}}
/* 3D */
.show3d{position:relative;height:min(68vh,540px);min-height:340px;margin:1rem -1.4rem 0;touch-action:pan-y;cursor:grab;overflow:hidden}
.show3d:active{cursor:grabbing}
.show3d canvas{display:block;width:100%;height:100%}
h1 span{filter:drop-shadow(1px 1px 0 #9aa1ab) drop-shadow(2px 2px 0 #7d8590) drop-shadow(3px 5px 4px rgba(29,34,41,.3))}
.btn.primary{box-shadow:0 6px 0 #8f98a3,0 14px 22px rgba(29,34,41,.25);transform:translateY(-2px)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #8f98a3,0 4px 8px rgba(29,34,41,.2)}
.btn.outline{box-shadow:0 5px 0 #1d2229}
.btn.outline:active{transform:translateY(4px);box-shadow:0 1px 0 #1d2229}
.reveal{transform:perspective(900px) translateY(26px) rotateX(16deg);transform-origin:50% 100%}
.reveal.in{transform:none}
.item.reveal.in{transition:transform .18s ease-out,opacity .8s}
.item{transform-style:preserve-3d}
@media(min-width:820px){.show3d{margin:1rem 0 0}}
/* hero : voiture à l'arrière de l'écran */
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:clamp(620px,calc(100svh - 110px),820px);padding-bottom:1.6rem}
.hero>*:not(.show3d){position:relative;z-index:2;pointer-events:none}
.hero .btn{pointer-events:auto}
.hero .show3d{position:absolute;inset:0;z-index:0;height:auto;min-height:0;margin:0}
.hero p{margin:1rem 0 0;font-weight:600;color:var(--ink);max-width:none}
.hero .btns{margin-top:auto}
@media(min-width:820px){.hero{justify-content:center}.hero h1,.hero p{max-width:min(560px,46vw)}.hero .btns{margin-top:1.8rem}}
/* vidéos : correctifs Safari + lecture */
.face{transform:translateZ(0)}
.face::after{content:"";position:absolute;inset:0;background:#0b0e12;opacity:0;transition:opacity .9s;pointer-events:none}
.pos-l .face::after,.pos-r .face::after{opacity:.42}
.pbtn{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(29,34,41,.6);display:none;pointer-events:none;z-index:3}
.pbtn::after{content:"";position:absolute;left:25px;top:18px;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent}
.pos-0 .face.paused .pbtn{display:block}
.verr{display:none;position:absolute;inset:0;z-index:4;align-items:center;justify-content:center;text-align:center;padding:1rem;background:rgba(11,14,18,.82);color:#fff;font-weight:700;font-size:.85rem}
.face.err .verr{display:flex}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

if(window.__V)document.querySelectorAll("video[data-vid]").forEach(v=>{try{const b=atob(window.__V[v.dataset.vid]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);v.src=URL.createObjectURL(new Blob([a],{type:"video/mp4"}))}catch(e){}});

 v.addEventListener("error",()=>f.classList.add("err"));v.addEventListener("loadeddata",()=>f.classList.remove("err"));});
const cards=[...document.querySelectorAll(".v3d")],stage=$("stage");let cur=0,seen=false;
function layout(){cards.forEach((c,i)=>{c.classList.remove("pos-0","pos-l","pos-r","pos-h");let rel=i-cur;const n=cards.length;if(rel>n/2)rel-=n;if(rel<-n/2)rel+=n;c.classList.add(rel===0?"pos-0":rel===-1?"pos-l":rel===1?"pos-r":"pos-h");
 c.querySelector(".face").style.transform="";const v=c.querySelector("video");(i===cur&&seen)?v.play().catch(()=>{}):v.pause();});
 document.querySelectorAll("#dots i").forEach((d,i)=>d.classList.toggle("on",i===cur));}
const go=n=>{cur=(n+cards.length)%cards.length;layout();};
$("vn").onclick=()=>go(cur+1);$("vp").onclick=()=>go(cur-1);
cards.forEach((c,i)=>c.addEventListener("click",()=>{if(i!==cur)return go(i);const v=c.querySelector("video");v.paused?v.play().catch(()=>{}):v.pause();}));
stage.addEventListener("pointermove",e=>{const f=cards[cur].querySelector(".face"),r=f.getBoundingClientRect();
 const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;if(px<0||px>1||py<0||py>1)return;
 f.style.transform=`rotateX(${(.5-py)*16}deg) rotateY(${(px-.5)*20}deg)`;f.style.setProperty("--px",px*100+"%");f.style.setProperty("--py",py*100+"%");});
stage.addEventListener("pointerleave",()=>{cards[cur].querySelector(".face").style.transform="";});
let sx=null;stage.addEventListener("pointerdown",e=>sx=e.clientX);
stage.addEventListener("pointerup",e=>{if(sx!==null&&Math.abs(e.clientX-sx)>45)go(cur+(e.clientX<sx?1:-1));sx=null;});
new IntersectionObserver(es=>{seen=es[0].isIntersecting;layout();},{threshold:.35}).observe(stage);
layout();

/* showroom 3D : Hyundai Grand i10 (voiture seule) */
(function(){
const host=document.getElementById("show3d");

let r;try{r=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){return}
const V=THREE.Vector3;
r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping;r.outputEncoding=THREE.sRGBEncoding;
host.appendChild(r.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,.05,60);
function rs(){const w=host.clientWidth||300,h=host.clientHeight||300;r.setSize(w,h,false);cam.aspect=w/h;cam.fov=cam.aspect<1?64:42;if(cam.aspect>1.2)cam.setViewOffset(w,h,-w*.2,0,w,h);else cam.clearViewOffset();cam.updateProjectionMatrix()}
new ResizeObserver(rs).observe(host);rs();
sc.add(new THREE.HemisphereLight(0xffffff,0x8a919c,.95));
const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(4,7,3);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);
Object.assign(dl.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:20});sc.add(dl);
const dl2=new THREE.DirectionalLight(0xdfe8ff,.6);dl2.position.set(-5,3,-4);sc.add(dl2);

const M=(c,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color:c,roughness:.4,metalness:.1},o));
const white=M(0xf6f7f9,{roughness:.22,metalness:.25,clearcoat:1,clearcoatRoughness:.08});
const dark=M(0x15171b,{roughness:.6}),silver=M(0xd0d5dc,{metalness:.9,roughness:.2}),chrome=M(0xdfe3e8,{metalness:.35,roughness:.25});
const glass=M(0x0d1620,{transparent:true,opacity:.28,roughness:.05,metalness:.6,depthWrite:false});

const car=new THREE.Group();sc.add(car);

function ex(pts,depth,mat){const b=.03,s=new THREE.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
 const d=depth-b*2,g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSize:b,bevelThickness:b,bevelSegments:3});
 g.translate(0,0,-d/2);const m=new THREE.Mesh(g,mat);m.castShadow=true;car.add(m);return m}
function box(w,h,d,mat,x,y,z,par=car){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;par.add(m);return m}
function limb(a,b,rad,mat){const A=new V(...a),B=new V(...b),d=B.clone().sub(A);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,d.length(),10),mat);m.position.copy(A.clone().add(B).multiplyScalar(.5));
 m.quaternion.setFromUnitVectors(new V(0,1,0),d.normalize());m.castShadow=true;car.add(m);return m}

[-1.2,1.2].forEach(x=>[-1,1].forEach(s=>{
 const a=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.22,24),dark);a.rotation.x=Math.PI/2;a.position.set(x,.42,s*.72);car.add(a);

[-.4,.42].forEach(z=>{box(.5,.12,.5,seatM,-.3,.62,z);box(.1,.62,.5,seatM,-.58,.95,z).rotation.z=.12});
const tg=new THREE.Group();tg.position.set(.22,1.06,-.4);tg.rotation.z=-.45;car.add(tg);
const sg=new THREE.Group();sg.rotation.y=Math.PI/2;tg.add(sg);
sg.add(new THREE.Mesh(new THREE.TorusGeometry(.17,.022,10,32),dark));

const doorG=new THREE.Group();doorG.position.set(.6,0,-.78);car.add(doorG);

gr.addColorStop(0,"#fff");gr.addColorStop(.55,"#fff");gr.addColorStop(1,"#000");x.fillStyle=gr;x.fillRect(0,0,256,256);

{const m=new THREE.Mesh(new THREE.BoxGeometry(.09,.012,2.9),lineM);m.position.set(-2.7,.008,0);sc.add(m)}

/* caméra : tour automatique + glisser pour tourner */
let ang=.7,drag=false,lx=0,idle=0,t=0,last=performance.now(),vis=true;
host.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;try{host.setPointerCapture(e.pointerId)}catch(_){}});
host.addEventListener("pointermove",e=>{if(!drag)return;ang-=(e.clientX-lx)*.009;lx=e.clientX;idle=2.2});
const up=()=>{drag=false};host.addEventListener("pointerup",up);host.addEventListener("pointercancel",up);
new IntersectionObserver(es=>{vis=es[0].isIntersecting}).observe(host);
(function frame(n){requestAnimationFrame(frame);
 if(!vis||document.hidden){last=n;return}
 const d=Math.min((n-last)/1000,.1);last=n;t+=d;
 if(!drag){if(idle>0)idle-=d;else ang+=d*.28}
 const rad=cam.aspect<1?7.4:6.4,y=1.75+Math.sin(t*.45)*.3;
 cam.position.set(Math.cos(ang)*rad,y,Math.sin(ang)*rad);cam.lookAt(0,.8,0);
 logo.rotation.y+=d*.9;logo.position.y=1.7+Math.sin(t*1.3)*.1;
 r.render(sc,cam)})(last);
})();
